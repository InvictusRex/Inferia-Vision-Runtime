[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ivr"
version = "0.1.0"
description = "Runtime orchestration framework for adaptive AI perception; models vision execution as a sequential decision-making problem and uses RL to orchestrate models, configs, and hardware by scene complexity and deployment constraints."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "opencv-python>=4.5",
    "ultralytics>=8.3",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "pyyaml>=6.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "black>=24"]

[tool.setuptools.packages.find]
where = ["implementation"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.black]
line-length = 100
target-version = ["py39"]
