  soc: RK3588S2
  npu_tops_int8: 6.0
  memory_type: LPDDR4X
  memory_shared: true
  system_memory_mb: 8192
simulated:
  npu_efficiency: 0.5
  activation_scale_mb: 60.0
  power_idle_w: 3.0
  power_envelope_w: 15.0
  mem_bandwidth_power_share: 0.25
  ambient_temp_c: 35.0
  temp_rise_c: 40.0
  temp_ewma_alpha: 0.2
  thermal_throttle_temp_c: 80.0
  thermal_throttle_latency_factor: 1.5
  thermal_throttle_enabled: false
policy:
  power_budget_w: 40.0
  inference_memory_budget_mb: 512
  target_fps: 30.0
