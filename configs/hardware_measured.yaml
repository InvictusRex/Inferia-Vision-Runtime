# ROCK 5C profile with `measured:` filled from on-device benchmarks.
# Latency, NPU utilisation and temperature per config are measured. Power has no
# on-board sensor and the unified-memory delta is too noisy at these model sizes
# (see output/rknn_board_profile.csv), so both stay simulated. Generated by
# tooling_scripts/rknn_measured_profile.py -- edit the benchmark, not this file.
name: rock_5c_rk3588s2
