# Accuracy under a time-varying latency deadline, with a penalty that grows with how late a
# frame is instead of a flat one. Used to train PPO; evaluation keeps the flat penalty of
# reward_detrac_deadline.yaml.
# Quality uses the official UA-DETRAC scoring, as in reward_detrac_deadline.yaml.
quality_backend: map
w_quality: 2.0
w_latency: 0.0
w_compute: 0.0
w_switch: 0.3
w_deadline: 2.0
deadline_penalty: proportional  # a late frame pays w_deadline x its overshoot fraction, capped at w_deadline
target_count: 10.0
max_latency_ms: 100.0
min_fps: 0.0
labels_path: null
latency_source: edge_profile
latency_jitter_ms: 0.0
constraints: {}
constraint_weights: {}
map_iou_threshold: 0.5
vehicle_classes: [2, 5, 7]  # COCO car, bus, truck
mask_ignored_regions: true
