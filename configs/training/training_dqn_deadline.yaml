algorithm: dqn
timesteps: 120000
policy: MlpPolicy
learning_rate: 0.0001
buffer_size: 200000
batch_size: 64
gamma: 0.95  # the config choice mostly affects the current frame; a shorter horizon than 0.99 keeps the
             # small accuracy gaps between configs visible, long enough to repay a 0.3 switch
train_freq: 4
gradient_steps: 1
target_update_interval: 1000
exploration_fraction: 0.3
exploration_final_eps: 0.05
save_dir: training
tb_dir: runs/tensorboard
log_name: dqn_detrac_deadline
